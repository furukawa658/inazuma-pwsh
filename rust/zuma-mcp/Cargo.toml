[package]
name = "zuma-mcp"
version = "1.0.4"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
encoding_rs = "0.8"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
