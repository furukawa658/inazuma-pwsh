name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64, executable: vscode-extension/server/win-x64/InazumaPwsh.exe }
          - { os: ubuntu-latest, target: linux-x64, executable: vscode-extension/server/linux-x64/InazumaPwsh }
          - { os: macos-latest, target: darwin-arm64, executable: vscode-extension/server/osx-arm64/InazumaPwsh }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os == 'windows-latest'
      - name: Build packaged server
        run: node vscode-extension/build-target.mjs ${{ matrix.target }}
      - name: Run packaged real smoke test
        run: node rust/zuma-mcp/tests/real-smoke.mjs ${{ matrix.executable }}
